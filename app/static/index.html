<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Glossa</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='9' width='28' height='15' rx='3' fill='%23f5e15a'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='16' text-anchor='middle' fill='%231b2440'%3EGl%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/app.css?v=0.3.1">
</head>
<body>

<!-- ============ sign in / first-run setup ============ -->
<section id="auth" class="auth" hidden>
  <div class="auth-card">
    <div class="auth-top">
      <div class="auth-word">Gl<span>oss</span>a</div>
      <select class="lang-picker" data-i18n-aria="lang.label"></select>
    </div>
    <p class="auth-sample" data-i18n="auth.tagline"></p>

    <form id="setup-form" class="stack" hidden>
      <h2 data-i18n="setup.title"></h2>
      <p class="muted" data-i18n="setup.intro"></p>
      <label class="field"><span class="field-label" data-i18n="setup.team_name"></span>
        <input type="text" name="team_name" data-i18n-ph="setup.team_name_ph" maxlength="80"></label>
      <label class="field"><span class="field-label" data-i18n="setup.password"></span>
        <input type="password" name="password" minlength="8" required autocomplete="new-password">
        <span class="field-help" data-i18n="setup.password_help"></span></label>
      <p class="form-error" role="alert"></p>
      <button class="btn btn-primary" type="submit" data-i18n="setup.submit"></button>
    </form>

    <form id="login-form" class="stack" hidden>
      <h2 data-i18n="login.title"></h2>
      <label class="field"><span class="field-label" data-i18n="login.password"></span>
        <input type="password" name="password" required autocomplete="current-password">
        <span class="field-help" data-i18n="login.help"></span></label>
      <p class="form-error" role="alert"></p>
      <button class="btn btn-primary" type="submit" data-i18n="login.submit"></button>
    </form>
  </div>
</section>

<!-- ============ app ============ -->
<div id="app" hidden>
  <header class="bar">
    <div class="bar-inner">
      <a class="brand" href="#overview"><span class="brand-word">Gl<span>oss</span>a</span><span class="brand-team" id="team-name"></span></a>
      <nav class="nav" data-i18n-aria="nav.aria">
        <a href="#overview" data-view="overview" data-i18n="nav.overview"></a>
        <a href="#glossary" data-view="glossary"><span data-i18n="nav.glossary"></span><span class="nav-badge" id="nav-badge" hidden></span></a>
        <a href="#try" data-view="try" data-i18n="nav.try"></a>
        <a href="#settings" data-view="settings" data-i18n="nav.settings"></a>
      </nav>
      <select class="lang-picker" data-i18n-aria="lang.label"></select>
      <button class="signout" id="signout" type="button" data-i18n="nav.signout"></button>
    </div>
  </header>

  <main>
    <!-- ---------- overview ---------- -->
    <section id="view-overview" data-view-panel="overview" hidden>
      <div class="notice" id="setup-notice" hidden>
        <p data-i18n-html="overview.notice_html"></p>
        <a class="btn btn-primary" href="#settings" data-i18n="overview.open_settings"></a>
      </div>

      <div class="notice notice-review" id="proposal-notice" hidden>
        <p id="proposal-notice-text"></p>
        <a class="btn" href="#glossary" data-i18n="overview.review"></a>
      </div>

      <p class="statement" id="statement"></p>
      <p class="lede" id="statement-sub"></p>
      <p class="lede small" id="calls-line"></p>

      <div class="overview-grid">
        <div class="stack">
          <div class="panel">
            <div class="section-head" style="margin-bottom:4px">
              <h3 data-i18n="chart.title"></h3>
            </div>
            <div class="legend" aria-hidden="true">
              <span><i style="background:var(--series-memory)"></i><span data-i18n="chart.legend_memory"></span></span>
              <span><i style="background:var(--series-new)"></i><span data-i18n="chart.legend_new"></span></span>
            </div>
            <div class="chart" id="chart"></div>
          </div>

          <div class="panel">
            <h3 style="margin-bottom:6px" data-i18n="terms.title"></h3>
            <ul class="term-list" id="top-terms"></ul>
          </div>
        </div>

        <div class="panel" id="connect">
          <h2 style="margin-bottom:6px" data-i18n="connect.title"></h2>
          <p class="muted" style="margin-bottom:20px" data-i18n="connect.intro"></p>
          <ol class="steps">
            <li data-i18n-html="connect.step1_html"></li>
            <li data-i18n-html="connect.step2_html"></li>
            <li><span data-i18n="connect.step3"></span>
              <div class="copy-field"><code id="ep-openai"></code><button class="btn" type="button" data-copy="ep-openai" data-i18n="connect.copy"></button></div>
            </li>
            <li><span data-i18n="connect.step4"></span>
              <div class="copy-field"><code id="team-key"></code><button class="btn" type="button" data-copy="team-key" data-i18n="connect.copy"></button></div>
              <span class="field-help" data-i18n="connect.step4_help"></span>
            </li>
            <li data-i18n="connect.step5"></li>
          </ol>
          <div class="row" style="margin-top:24px">
            <button class="btn btn-primary" type="button" id="copy-invite" data-i18n="connect.invite"></button>
          </div>
          <div class="member-link">
            <h3 data-i18n="connect.member_title"></h3>
            <p class="small muted" data-i18n="connect.member_body"></p>
            <div class="copy-field"><code id="suggest-url"></code><button class="btn" type="button" data-copy="suggest-url" data-i18n="connect.copy"></button></div>
          </div>
          <details class="more" style="margin-top:20px">
            <summary data-i18n="connect.custom_summary"></summary>
            <p class="small muted" data-i18n="connect.custom_body"></p>
            <div class="copy-field"><code id="ep-custom"></code><button class="btn" type="button" data-copy="ep-custom" data-i18n="connect.copy"></button></div>
            <p class="small muted" style="margin-top:8px" data-i18n="connect.custom_note"></p>
          </details>
        </div>
      </div>

      <div class="section">
        <div class="section-head"><h2 data-i18n="recent.title"></h2></div>
        <div class="panel table-wrap" id="recent"></div>
      </div>
    </section>

    <!-- ---------- glossary ---------- -->
    <section id="view-glossary" data-view-panel="glossary" hidden>
      <div class="section-head">
        <div>
          <h1 data-i18n="glossary.title"></h1>
          <p class="lede" data-i18n="glossary.lede"></p>
        </div>
        <div class="row">
          <label class="btn" for="import-file" data-i18n="glossary.import"></label>
          <input type="file" id="import-file" accept=".csv,text/csv" class="sr-only">
          <a class="btn" href="/api/glossary/export" data-i18n="glossary.export"></a>
        </div>
      </div>

      <div class="panel proposals" id="proposals" hidden>
        <h2 id="proposals-title"></h2>
        <p class="lede small" data-i18n="proposal.lede"></p>
        <ul class="proposal-list" id="proposal-list"></ul>
      </div>

      <form class="panel add-term" id="add-term">
        <label class="field"><span class="field-label" data-i18n="glossary.term"></span><input type="text" name="source" required data-i18n-ph="glossary.term_ph" maxlength="200" class="lang-text"></label>
        <label class="field"><span class="field-label" data-i18n="glossary.target"></span><input type="text" name="target" required data-i18n-ph="glossary.target_ph" maxlength="200" class="lang-text"></label>
        <label class="field"><span class="field-label" data-i18n="glossary.into"></span><select name="target_lang" class="lang-select"></select></label>
        <label class="field"><span class="field-label" data-i18n-html="glossary.note_html"></span><input type="text" name="note" maxlength="300" data-i18n-ph="glossary.note_ph"></label>
        <button class="btn btn-primary add-btn" type="submit" data-i18n="glossary.add"></button>
        <div class="add-term-options">
          <label class="check small"><input type="checkbox" name="case_sensitive"> <span data-i18n="glossary.case_label"></span></label>
          <label class="check small"><input type="checkbox" name="conditional"> <span data-i18n="glossary.cond_label"></span></label>
          <span class="small muted" data-i18n="glossary.cond_help"></span>
        </div>
      </form>

      <div class="section-head" style="margin-top:28px">
        <h2 id="glossary-count"></h2>
        <input type="search" id="glossary-search" data-i18n-ph="glossary.search_ph" data-i18n-aria="glossary.search_ph" style="max-width:280px">
      </div>
      <div class="panel table-wrap" id="glossary-list"></div>

      <div class="section">
        <div class="section-head" style="margin-bottom:6px">
          <h2 data-i18n="history.title"></h2>
        </div>
        <p class="lede" style="margin:0 0 16px" data-i18n="history.lede"></p>
        <div class="panel" id="history-list"></div>
        <div class="row" style="margin-top:10px"><button class="btn btn-quiet" type="button" id="history-more" hidden></button></div>
      </div>

      <div class="section">
        <div class="panel stack">
          <div>
            <h2 data-i18n="suggest.title"></h2>
            <p class="lede" data-i18n="suggest.lede"></p>
          </div>
          <textarea id="suggest-text" class="lang-text" data-i18n-ph="suggest.ph"></textarea>
          <div class="row">
            <button class="btn btn-primary" type="button" id="suggest-btn" data-i18n="suggest.button"></button>
            <span class="muted small" id="suggest-status"></span>
          </div>
          <div id="suggest-results" hidden>
            <ul class="suggestions" id="suggest-list"></ul>
            <div class="row" style="margin-top:12px"><button class="btn btn-primary" type="button" id="suggest-add" data-i18n="suggest.add"></button></div>
          </div>
        </div>
      </div>
    </section>

    <!-- ---------- try it ---------- -->
    <section id="view-try" data-view-panel="try" hidden>
      <h1 data-i18n="try.title"></h1>
      <p class="lede" data-i18n="try.lede"></p>
      <div class="try-grid section" style="margin-top:24px">
        <form class="panel stack try-input" id="try-form">
          <label class="field"><span class="field-label" data-i18n="try.text"></span>
            <textarea name="text" id="try-text" data-i18n-ph="try.text_ph"></textarea></label>
          <div class="row">
            <label class="field" style="flex:1; min-width:160px"><span class="sr-only" data-i18n="try.into"></span><select name="target_lang" class="lang-select" data-i18n-aria="try.into"></select></label>
            <button class="btn" type="button" id="try-sample" data-i18n="try.sample"></button>
            <button class="btn btn-primary" type="submit" data-i18n="try.submit"></button>
          </div>
        </form>
        <div class="panel" id="try-output" aria-live="polite">
          <p class="result-empty" data-i18n="try.empty"></p>
        </div>
      </div>
    </section>

    <!-- ---------- settings ---------- -->
    <section id="view-settings" data-view-panel="settings" hidden>
      <h1 data-i18n="settings.title"></h1>
      <form id="settings-form" class="section" style="margin-top:28px">
        <div class="settings-grid">
          <div class="settings-side"><h3 data-i18n="settings.provider_h"></h3><p data-i18n="settings.provider_p"></p></div>
          <div class="stack">
            <label class="field"><span class="field-label" data-i18n="settings.provider"></span><select name="provider" id="provider"></select></label>
            <div class="grid-2">
              <label class="field"><span class="field-label" data-i18n="settings.base_url"></span><input type="url" name="llm_base_url" required></label>
              <label class="field"><span class="field-label" data-i18n="settings.model"></span><input type="text" name="llm_model" required></label>
            </div>
            <label class="field"><span class="field-label" data-i18n="settings.api_key"></span>
              <input type="password" name="llm_api_key" autocomplete="off" id="api-key-input">
              <span class="field-help" id="api-key-help"></span></label>
            <label class="field"><span class="field-label" data-i18n="settings.rpm"></span>
              <input type="number" name="max_rpm" min="0" step="1" style="max-width:160px">
              <span class="field-help" data-i18n="settings.rpm_help"></span></label>
            <div class="row">
              <button class="btn" type="button" id="test-btn" data-i18n="settings.test"></button>
              <span class="test-result" id="test-result"></span>
            </div>
          </div>
        </div>

        <div class="settings-grid">
          <div class="settings-side"><h3 data-i18n="settings.translation_h"></h3><p data-i18n="settings.translation_p"></p></div>
          <div class="stack">
            <label class="field"><span class="field-label" data-i18n="settings.default_lang"></span><select name="default_target_lang" class="lang-select"></select>
              <span class="field-help" data-i18n="settings.default_lang_help"></span></label>
            <label class="field"><span class="field-label" data-i18n="settings.style"></span>
              <textarea name="style_guide" data-i18n-ph="settings.style_ph"></textarea>
              <span class="field-help" data-i18n="settings.style_help"></span></label>
            <div class="grid-2">
              <label class="field"><span class="field-label" data-i18n-html="settings.temp_html"></span><input type="number" name="temperature" min="0" max="2" step="0.1" data-i18n-ph="settings.temp_ph">
                <span class="field-help" data-i18n="settings.temp_help"></span></label>
              <label class="field"><span class="field-label" data-i18n="settings.price"></span><input type="number" name="price_per_m_tokens" min="0" step="0.01">
                <span class="field-help" data-i18n="settings.price_help"></span></label>
            </div>
          </div>
        </div>

        <div class="settings-grid">
          <div class="settings-side"><h3 data-i18n="settings.team_h"></h3></div>
          <div class="stack">
            <label class="field"><span class="field-label" data-i18n="settings.team_name"></span><input type="text" name="team_name" maxlength="80"></label>
            <div class="row"><button class="btn btn-primary" type="submit" data-i18n="settings.save"></button></div>
          </div>
        </div>
      </form>

      <div class="settings-grid settings-sep">
        <div class="settings-side"><h3 data-i18n="settings.access_h"></h3><p data-i18n="settings.access_p"></p></div>
        <div class="stack">
          <div class="row" style="justify-content:space-between">
            <div><strong data-i18n="settings.key_title"></strong><p class="muted small" data-i18n="settings.key_desc"></p></div>
            <button class="btn btn-danger" type="button" id="rotate-btn" data-i18n="settings.rotate"></button>
          </div>
          <div class="row" style="justify-content:space-between">
            <div><strong data-i18n="settings.memory_title"></strong><p class="muted small" id="memory-size"></p></div>
            <button class="btn btn-danger" type="button" id="clear-btn" data-i18n="settings.clear"></button>
          </div>
        </div>
      </div>
    </section>
  </main>
</div>

<dialog id="warn-dialog" class="dialog" aria-labelledby="warn-title">
  <div id="warn-body"></div>
  <div class="row dialog-actions">
    <button class="btn" type="button" id="warn-back" data-i18n="warn.back"></button>
    <button class="btn btn-primary" type="button" id="warn-save" data-i18n="warn.save"></button>
  </div>
</dialog>

<div id="toast" class="toast" role="status" hidden></div>
<script src="/static/i18n.js?v=0.3.1"></script>
<script src="/static/app.js?v=0.3.1"></script>
</body>
</html>
